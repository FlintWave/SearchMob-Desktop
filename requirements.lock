# SearchMob Desktop — pinned runtime constraints for reproducible builds.
#
# This is a hash-free pip constraints file. It pins the project's RUNTIME dependencies (the
# [project].dependencies array in pyproject.toml) and their transitive closure to the exact
# versions that were verified working, so an install resolves the same set every time.
#
# It is used as a CONSTRAINTS file (`pip install -c requirements.lock ...`), not a requirements
# file: it does not by itself install anything. `pip` only applies a pin here to a package that
# some other requirement (pyproject's `>=` ranges) already pulls in. That keeps it additive — it
# cannot drag in a package nothing asked for, and the `>=` floors in pyproject still hold.
#
# The dev / gui / storage extras and build-only tools (pytest, ruff, mypy, PySide6,
# sqlcipher3-binary, briefcase) are intentionally NOT pinned here so this file stays focused on
# the shipping runtime surface and does not couple CI to a tooling version.
#
# Regenerate after a dependency bump:
#   1. Create a clean venv and `pip install -e .`   (runtime deps only, no extras).
#   2. `pip freeze` and copy the resulting versions for the packages listed below.
#   (If pip-tools is available, `pip-compile --no-emit-index-url -o requirements.lock pyproject.toml`
#    produces an equivalent file; this curated form is the fallback when pip-compile is absent.)

