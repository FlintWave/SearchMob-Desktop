version: 2
updates:
  # Python deps (pyproject.toml) — group minor + patch, ignore breaking majors.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # GitHub Actions — grouped + SHA pins are converted by Dependabot.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
