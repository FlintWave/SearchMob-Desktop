name: CI

# Lint + tests on every push to main and every pull request. Native-installer builds live in their
# own workflow once Briefcase is wired up.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt runtime libraries (needed to import PySide6 on headless Linux)
        # PySide6's modules dlopen libEGL + xcb plugins at import time, even when the test
        # never constructs a QApplication. Installing just enough so the imports succeed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3

      - name: Install (editable, all extras + briefcase)
        # Pull in the gui and storage extras too so mypy can see PySide6 + sqlcipher3 stubs;
        # without them, the GUI and SQLCipher-backed history modules trip "Cannot find
        # implementation or library stub" errors that mypy treats as fatal.
        # Briefcase is a build-time dep, not a runtime dep, but we install it in CI so the
        # smoke check below can validate [tool.briefcase.*] parses without errors before the
        # heavier release.yml workflow runs the full packaging.
        run: |
          python -m pip install --upgrade pip
          # requirements.lock pins the runtime dependency closure for reproducibility. It is applied
          # as a CONSTRAINTS file (-c), so it only pins packages the install already resolves and
          # never pulls in anything extra; the dev/gui/storage extras stay unpinned.
          pip install -c requirements.lock -e ".[dev,gui,storage]"
          pip install briefcase

      - name: Ruff format
        run: ruff format --check

      - name: Ruff
        run: ruff check

      - name: mypy
        run: mypy src

      - name: Pytest
        run: pytest -q

      # Briefcase config smoke: imports the library and parses pyproject.toml's
      # [tool.briefcase.*] tables for all three target platforms. Catches schema typos
      # without running the (slow, platform-specific) real packaging step.
      - name: Briefcase config smoke check
        run: |
          python -c "import briefcase; print('briefcase', briefcase.__version__)"
          python - <<'PY'
          from pathlib import Path
          from briefcase.console import Console
          from briefcase.config import parse_config
          console = Console()
          for platform, fmt in [("linux", "system"), ("macOS", "app"), ("windows", "app")]:
              global_cfg, apps = parse_config(
                  Path("pyproject.toml"), platform, fmt, console
              )
              assert "searchmob_desktop" in apps, f"app missing for {platform}"
              print(f"{platform}/{fmt}: ok")
          PY
