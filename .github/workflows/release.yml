name: release

# Build Linux .deb / macOS .dmg / Windows .msi installers with Briefcase, then publish the artifacts
# (plus SHA256SUMS) to the GitHub Release. Triggered only when a Release is published or a v* tag is
# pushed; ordinary pushes and pull requests never reach this workflow.
#
# Signing status (first release): UNSIGNED.
# - Windows: --adhoc-sign (no Authenticode signature). Future signing lives behind a
#   WINDOWS_CODESIGN_PFX_BASE64 / WINDOWS_CODESIGN_PFX_PASSWORD secret pair.
# - macOS: --adhoc-sign (Apple's "ad-hoc" identity, not notarized). Future notarization lives
#   behind APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID / APPLE_CERT_* secrets.
# - Linux: .deb is not code-signed in the Authenticode sense; downstream apt repos sign the
#   index. The SHA256SUMS file is the integrity anchor for end users for this first release.
#
# Third-party actions are pinned by full commit SHA (supply-chain hardening); the trailing comment
# is the human-readable version tag.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

# Read-only by default; the publish job below elevates to contents: write to attach assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # `package_args` is everything after `briefcase package`. Linux uses the `system` backend
      # inside a per-distro Docker container (--target), which sidesteps the runner's system-Python
      # mismatch that made native Linux builds fail before. deb/rpm/dmg/msi are required; the
      # Flatpak leg is marked experimental (continue-on-error) until it has proven stable in CI.
      matrix:
        include:
          - os: macos-latest
            label: macos-dmg
            package_args: 'macOS --adhoc-sign'
            artifact_glob: 'dist/*.dmg'
          - os: windows-latest
            label: windows-msi
            package_args: 'windows --adhoc-sign'
            artifact_glob: 'dist/*.msi'
          - os: ubuntu-latest
            label: linux-deb
            package_args: 'linux system -p deb --target ubuntu:24.04'
            artifact_glob: 'dist/*.deb'
          - os: ubuntu-latest
            label: linux-rpm
            package_args: 'linux system -p rpm --target fedora:41'
            artifact_glob: 'dist/*.rpm'
          - os: ubuntu-latest
            label: linux-flatpak
            package_args: 'linux flatpak'
            artifact_glob: 'dist/*.flatpak'
            flatpak: true
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Briefcase and the project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
          pip install -e ".[gui]"

      # Flatpak needs flatpak-builder plus the freedesktop runtime/SDK on the runner.
      - name: Set up Flatpak toolchain
        if: matrix.flatpak
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      # --adhoc-sign produces a buildable-but-unsigned artifact on macOS/Windows; Linux ignores it.
      - name: Briefcase package
        shell: bash
        run: |
          briefcase package ${{ matrix.package_args }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release assets and compute SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          # Flatten the matrix output (one subdir per matrix label) into dist/.
          find artifacts -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.flatpak' \) \
            -exec cp -v {} dist/ \;
          # GitHub sanitizes characters outside [A-Za-z0-9._-] (spaces, '~', ...) to '.' in release
          # asset names. Rename the staged files the same way BEFORE hashing so the names recorded
          # in SHA256SUMS match the published asset names and `sha256sum -c` works for downloaders.
          ( cd dist && for f in *; do
              s=$(printf '%s' "$f" | sed 's/[^A-Za-z0-9._-]/./g')
              if [ "$f" != "$s" ]; then mv -- "$f" "$s"; fi
            done )
          # Require the four confident installers; the Flatpak leg is experimental and may be absent.
          for ext in dmg msi deb rpm; do
            if ! ls dist/*."$ext" >/dev/null 2>&1; then
              echo "::error::missing required installer: *.$ext"; exit 1
            fi
          done
          ( cd dist && sha256sum -- * > SHA256SUMS )
          echo "Published artifacts:"
          cat dist/SHA256SUMS

      # Required installers were enforced above; fail_on_unmatched_files is false so a missing
      # (experimental) Flatpak does not block publishing the rest.
      - name: Publish installers + SHA256SUMS to the GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          # A tag with a `-rc` suffix (e.g. v26.06.01-rc.1) publishes a PRE-RELEASE: it is not
          # marked "Latest", so the once-a-day in-app update check (which reads /releases/latest)
          # never offers it to users. Push such a tag to test a real installer build without
          # announcing a new version; a normal `vX.Y.Z` tag publishes the announced release.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/*.dmg
            dist/*.msi
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
            dist/SHA256SUMS
          fail_on_unmatched_files: false
