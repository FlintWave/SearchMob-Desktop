[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchmob-desktop"
description = "SearchMob Desktop: private, on-device metasearch for Windows, macOS, and Linux."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "FlintWave", email = "flintwave@tuta.com" }]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["search", "metasearch", "privacy", "duckduckgo", "mojeek", "marginalia", "wikipedia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

# Core runtime: HTTP client + local server + CLI rendering + symmetric crypto + KDF.
# Optional extras keep the headless / CLI-only install slim.
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "starlette>=0.45",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "rich>=14",
    "cryptography>=45",
    "argon2-cffi>=24",
    "platformdirs>=4",
    "keyring>=25",
    "mcp>=1.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
# pysqlcipher3 is unmaintained and fails to build on modern toolchains; sqlcipher3-binary is the
# actively-shipped wheel of the same C binding (`sqlcipher3` module), so the import surface used
# below is identical.
storage = ["sqlcipher3-binary>=0.5"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.15",
]

[project.scripts]
searchmob-desktop = "searchmob_desktop.cli:main"

[project.urls]
Homepage = "https://github.com/FlintWave/SearchMob-Desktop"
Repository = "https://github.com/FlintWave/SearchMob-Desktop"
Issues = "https://github.com/FlintWave/SearchMob-Desktop/issues"
Changelog = "https://github.com/FlintWave/SearchMob-Desktop/releases"

[tool.hatch.version]
path = "src/searchmob_desktop/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/searchmob_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Vendored third-party Double Metaphone (BSD); kept verbatim, not linted/formatted by us.
extend-exclude = ["src/searchmob_desktop/engines/correct/_metaphone"]

[tool.ruff.lint]
# Pragmatic starter ruleset: errors, undefined-name, imports, bugbears, modern-Python upgrades,
# ruff's own catches. Tighten over time.
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
# Vendored third-party code is untyped; don't type-check it.
exclude = ["src/searchmob_desktop/engines/correct/_metaphone/"]

[[tool.mypy.overrides]]
module = "searchmob_desktop.engines.correct._metaphone.*"
ignore_errors = true
follow_imports = "skip"

# Briefcase packaging. The `briefcase package <platform>` build is driven by the tables below; the
# release workflow at .github/workflows/release.yml invokes it on the matching runner.
#
# Version is mirrored here (rather than read dynamically) because Briefcase resolves PEP621
# `dynamic = ["version"]` by running the PEP517 build backend in an isolated env, which is wasteful
# in CI. Bump both this string and src/searchmob_desktop/version.py together at release time.
[tool.briefcase]
project_name = "SearchMob Desktop"
bundle = "com.flintwave"
version = "26.05.11"
url = "https://github.com/FlintWave/SearchMob-Desktop"
author = "FlintWave"
author_email = "flintwave@tuta.com"

[tool.briefcase.app.searchmob_desktop]
formal_name = "SearchMob Desktop"
description = "Private, on-device metasearch for Windows, macOS, and Linux."
long_description = """SearchMob Desktop is a private, on-device metasearch client that aggregates
DuckDuckGo, Mojeek, Marginalia, Mwmbl, and Wikipedia behind a single search box. No tracking, no
cookies, no referrer, no account. The Android edition's privacy proxy and store-nothing-by-default
behavior carry over unchanged.
"""
# License (AGPL-3.0-or-later) and license_files are inherited from the PEP621 [project] table.
icon = "src/searchmob_desktop/resources/icon"
sources = ["src/searchmob_desktop"]
test_sources = ["tests"]
# Briefcase concatenates [project].dependencies onto this list (see merge_pep621_config), so we
# only list the GUI-only Qt dep here; the rest comes from the PEP621 dependencies array above.
# PySide6 lives in the `gui` optional-dependencies group for headless `pipx install` use, but the
# bundled installer always ships the GUI, so it is a hard requires for Briefcase builds.
requires = [
    "PySide6>=6.8",
]

[tool.briefcase.app.searchmob_desktop.macOS]
universal_build = true
min_os_version = "13.0"
requires = [
    "std-nslog~=1.0.3",
]

[tool.briefcase.app.searchmob_desktop.linux]
requires = []

# Linux ships native packages built with Briefcase's `linux system` backend inside a per-distro
# Docker container (`--target`), which avoids coupling to the runner's system Python. We build a
# `.deb` (Debian/Ubuntu target), an `.rpm` (Fedora target), and a Flatpak. The previous AppImage
# target was dropped: Briefcase's AppImage support is unreliable for PySide and never built here.
#
# Briefcase merges per-distro config: `linux.debian` applies to the .deb (Ubuntu's vendor base is
# Debian) and `linux.rhel` to the .rpm (Fedora's vendor base is RHEL). PySide6 bundles its own Qt
# .so files but they still dynamically link the system X11/GL/xcb stack, so we declare those as the
# package's runtime dependencies (present on any desktop, but declared for correctness).
[tool.briefcase.app.searchmob_desktop.linux.debian]
system_runtime_requires = [
    "libegl1",
    "libgl1",
    "libglib2.0-0",
    "libdbus-1-3",
    "libfontconfig1",
    "libfreetype6",
    "libxext6",
    "libxrender1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libxcb1",
    "libxcb-cursor0",
    "libxcb-icccm4",
    "libxcb-image0",
    "libxcb-keysyms1",
    "libxcb-randr0",
    "libxcb-render0",
    "libxcb-render-util0",
    "libxcb-shape0",
    "libxcb-shm0",
    "libxcb-sync1",
    "libxcb-xfixes0",
    "libxcb-xinerama0",
    "libxcb-xkb1",
]

[tool.briefcase.app.searchmob_desktop.linux.rhel]
system_runtime_requires = [
    "mesa-libEGL",
    "mesa-libGL",
    "glib2",
    "dbus-libs",
    "fontconfig",
    "freetype",
    "libXext",
    "libXrender",
    "libxkbcommon",
    "libxkbcommon-x11",
    "libxcb",
    "xcb-util-cursor",
    "xcb-util-wm",
    "xcb-util-image",
    "xcb-util-keysyms",
    "xcb-util-renderutil",
]

# Flatpak: the freedesktop runtime/SDK provide Python + the GUI stack. Built with flatpak-builder
# (installed in CI). The runtime version tracks a current freedesktop release.
[tool.briefcase.app.searchmob_desktop.linux.flatpak]
flatpak_runtime = "org.freedesktop.Platform"
flatpak_runtime_version = "23.08"
flatpak_sdk = "org.freedesktop.Sdk"

[tool.briefcase.app.searchmob_desktop.windows]
requires = []
